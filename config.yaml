# bili-news-video —— 时政快讯视频线配置
# 定位（2026-11-09 grokbot 讨论定稿）：日报型新闻播报，Grok 任务D（巴尔干快讯雷达）
# 出简报 → 本项目出 1-3 分钟带配音带字幕成片。只讲"发生了什么"和"各方怎么说"。

video:
  width: 1920
  height: 1080
  fps: 30
  # 每条动态的口播时长软上限（秒），超出在锤稿阶段提示删减
  max_segment_s: 40
  segment_tail_s: 0.8      # 每段音频后留白（呼吸感）
  hook_lead_s: 0.3         # 片头音频前留白

voice:
  # 后端优先级：cosy（若启用且环境就绪）→ edge → zhipu → 报错停线（绝不放机械音上线）
  edge_voice: zh-CN-YunxiNeural        # 新闻男声
  edge_rate: "+8%"                     # 快讯语速略快
  zhipu_model: cogtts
  zhipu_voice: tongtong
  cosy:
    enable: false                      # 打开后走 ../cosyvoice 批量合成
    mode: zero_shot
    spk: ""

glm:
  model: glm-4-flash
  temperature: 0.6                     # 新闻稿求稳，比风景线低
  timeout_s: 90
  max_tokens: 4000                     # 逐字稿+卡片字段一次出，给足
  repair_retries: 1                    # JSON/护栏修复重试一次，失败降级

show:
  name: "巴尔干快讯"                    # 栏目名（片头卡/片尾卡）
  region_nodes:                        # 棋盘卡固定节点布局（示意，非地理图）
    - {label: 塞尔维亚, x: 0.50, y: 0.42}
    - {label: 科索沃,   x: 0.50, y: 0.62}
    - {label: 波黑,     x: 0.28, y: 0.34}
    - {label: 黑山,     x: 0.30, y: 0.58}
    - {label: 北马其顿, x: 0.55, y: 0.80}
    - {label: 阿尔巴尼亚, x: 0.32, y: 0.78}
    - {label: 俄罗斯,   x: 0.86, y: 0.20}
    - {label: 西方/欧盟, x: 0.14, y: 0.16}
    - {label: 土耳其,   x: 0.84, y: 0.72}
  region_edges:                        # 外围博弈关系（棋盘主线）
    - [塞尔维亚, 科索沃]
    - [俄罗斯, 塞尔维亚]
    - [西方/欧盟, 科索沃]
    - [土耳其, 阿尔巴尼亚]

review:
  min_target_s: 60                     # 成片低于此长度建议并期
  max_target_s: 200                    # 超过建议拆期

qc:
  min_mean_volume_db: -45.0
  max_volume_db: -0.5
  duration_tolerance_s: 8.0            # 卡片配音对齐允许误差

publish:
  tid: 228                             # B站分区：知识·时事（风景号别用这个，会限流）
  tags: [国际, 时政, 军事, 地缘政治, 巴尔干]
  disclaimer: "本视频只复述公开报道与各方既有表述，不构成任何立场判断或预测。"
